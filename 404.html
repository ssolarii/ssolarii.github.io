            font-family: 'W95FA';
            src: url('assets/fonts/W95FA.woff2') format('woff2'),
                url('assets/fonts/W95FA.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('assets/bg.png');
            background-repeat: repeat;
            font-family: 'W95FA', 'MS Sans Serif', Arial, sans-serif;
            color: #000;
            padding: 20px;
        }

        .crt-toggle {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: #c0c0c0;
            color: #000;
            font-family: 'W95FA', 'MS Sans Serif', Arial, sans-serif;
            font-size: 12px;
            padding: 4px 10px;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            cursor: pointer;
            z-index: 100;
            image-rendering: pixelated;
            user-select: none;
        }

        .crt-toggle:active {
            border-color: #808080 #fff #fff #808080;
            padding: 5px 9px 3px 11px;
        }

        body.no-crt .crt {
            display: none;
        }

        .crt::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 20;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        @keyframes flicker {
            0% {
                opacity: 0.27861;
            }

            5% {
                opacity: 0.34769;
            }

            10% {
                opacity: 0.23604;
            }

            15% {
                opacity: 0.10626;
            }

            20% {
                opacity: 0.18128;
            }

            25% {
                opacity: 0.10626;
            }

            30% {
                opacity: 0.18128;
            }

            35% {
                opacity: 0.23604;
            }
        }

        .crt::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: rgba(18, 16, 16, 0.1);
            opacity: 0;
            z-index: 20;
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }

            max-width: 440px;

            border-image-width: 20px 11px 20px 19px;

            border-style: solid;
            border-color: transparent;

            text-align: center;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
            margin: 0 0 10px 0;
            color: #000;
        }

        .notice {
            font-size: 13px;
            color: #555;
            margin: 0 0 20px 0;
        }

        .notice p {
            margin: 6px 0;
        }

        .home-link {
            color: #000;
            text-decoration: underline;
            padding: 2px 4px;
        }

        .home-link:hover {
            background-color: #000;
            color: #fff;
        }

    <script>
        function initCrtToggle() {
            const btn = document.getElementById('crt-toggle');
            const isOff = localStorage.getItem('crt') === 'off';
            if (isOff) {
                document.body.classList.add('no-crt');
                if (btn) btn.textContent = 'crt: off';
            }
            if (btn) {
                btn.addEventListener('click', () => {
                    document.body.classList.toggle('no-crt');
                    const nowOff = document.body.classList.contains('no-crt');
                    localStorage.setItem('crt', nowOff ? 'off' : 'on');
                    btn.textContent = nowOff ? 'crt: off' : 'crt: on';
                });
            }
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initCrtToggle);
        } else {
            initCrtToggle();
        }
    </script>
</head>

<body>
    <button id="crt-toggle" class="crt-toggle" type="button">crt: on</button>
    <div class="crt"></div>
    <div class="card">
        <br><br><br>
        <h1 class="title">where are you?</h1>
        <div class="notice">
            <p>whooops, this page doesn't exist.</p>
            <p>maybe your link has a typo in it?</p>
            <br>
            <p><a href="index.html" class="home-link">🏠︎&nbsp;go home!</p>
        </div>
    </div>
</body>
