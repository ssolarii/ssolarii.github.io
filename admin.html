<body>
    <button id="crt-toggle" class="crt-toggle" type="button">crt: on</button>
    <div class="crt"></div>

    <!-- Auth Overlay -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h2 style="font-size: 16px; margin: 0 0 12px 0;">// blog admin login</h2>
            <div id="auth-error" style="color: red; font-size: 12px; margin-bottom: 8px; display: none;">invalid key /
                decryption failed</div>
            <form onsubmit="event.preventDefault(); handleAuthSubmit();">
                <input type="password" id="admin-key" class="retro-input" placeholder="enter admin key..." required
                    style="margin-bottom: 12px; text-align: center;">
                <button type="submit" id="unlock-btn" class="retro-btn">[ unlock dashboard ]</button>
            </form>
        </div>
    </div>

    <!-- Container for Decrypted Dashboard -->
    <div class="container" id="dashboard" style="display: none;"></div>

    <script>
        function base64ToBuf(b64) {
            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return bytes;
        }

        async function decryptAES(encObj, password) {
            const salt = base64ToBuf(encObj.salt);
            const iv = base64ToBuf(encObj.iv);
            const data = base64ToBuf(encObj.data);

            const encKey = new TextEncoder().encode(password);
            const keyMaterial = await window.crypto.subtle.importKey(
                "raw", encKey, "PBKDF2", false, ["deriveKey"]
            );

            const derivedKey = await window.crypto.subtle.deriveKey(
                { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
                keyMaterial,
                { name: "AES-GCM", length: 256 },
                false,
                ["decrypt"]
            );

            const decrypted = await window.crypto.subtle.decrypt(
                { name: "AES-GCM", iv },
                derivedKey,
                data
            );

            return new TextDecoder().decode(decrypted);
        }

        async function attemptLogin(password) {
            if (!window.__ADMIN_PASSCHECK__ || !window.__ADMIN_ENCRYPTED__) {
                console.error("Encrypted payload not loaded.");
                return false;
            }

            try {
                // Verify password against passcheck
                const check = await decryptAES(window.__ADMIN_PASSCHECK__, password);
                if (check !== "SOL_ADMIN_AUTHENTICATED") return false;

                // Decrypt and execute full admin payload in-memory
                const code = await decryptAES(window.__ADMIN_ENCRYPTED__, password);
                document.getElementById('auth-overlay').classList.add('hidden');
                sessionStorage.setItem('sol_admin_pass', password);

                const scriptEl = document.createElement('script');
                scriptEl.textContent = code;
                document.body.appendChild(scriptEl);
                return true;
            } catch (err) {
                console.warn("Decryption failed:", err);
                return false;
            }
        }

        async function handleAuthSubmit() {
            const btn = document.getElementById('unlock-btn');
            const errEl = document.getElementById('auth-error');
            const pwd = document.getElementById('admin-key').value;

            btn.disabled = true;
            btn.textContent = 'decrypting...';
            errEl.style.display = 'none';

            const ok = await attemptLogin(pwd);
            if (!ok) {
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = '[ unlock dashboard ]';
            }
        }

        function initCrtToggle() {
            const btn = document.getElementById('crt-toggle');
            const isOff = localStorage.getItem('crt') === 'off';
            if (isOff) {
                document.body.classList.add('no-crt');
                if (btn) btn.textContent = 'crt: off';
            }
            if (btn) {
                btn.addEventListener('click', () => {
                    document.body.classList.toggle('no-crt');
                    const nowOff = document.body.classList.contains('no-crt');
                    localStorage.setItem('crt', nowOff ? 'off' : 'on');
                    btn.textContent = nowOff ? 'crt: off' : 'crt: on';
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initCrtToggle();
            const saved = sessionStorage.getItem('sol_admin_pass');
            if (saved) {
                attemptLogin(saved);
            }
        });
    </script>
