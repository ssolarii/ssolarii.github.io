<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Condolences</title>
  <style>
    *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; overflow:hidden; overflow:auto; }
    body {
      display:flex; align-items:center; justify-content:center;
      background:#0e0e0e;
      font-family:'Georgia','Times New Roman',serif;
    }

    /* ── Loader ─────────────────────────────────── */
    .loader {
      position:fixed; inset:0; z-index:100;
      background:#0e0e0e;
      display:flex; align-items:center; justify-content:center;
      transition:opacity 0.6s ease;
    }
    .loader.done {
      opacity:0; pointer-events:none;
    }
    .loader__dot {
      width:6px; height:6px; border-radius:50%;
      background:#4a4a4a;
      margin:0 4px;
      animation:pulse 1.2s ease-in-out infinite;
    }
    .loader__dot:nth-child(2) { animation-delay:0.15s; }
    .loader__dot:nth-child(3) { animation-delay:0.3s; }
    @keyframes pulse {
      0%,100% { opacity:0.25; transform:scale(1); }
      50% { opacity:1; transform:scale(1.3); }
    }

    /* ── Scene (hidden until loaded) ────────────── */
    .scene {
      perspective:1800px;
      display:flex; flex-direction:column; align-items:center; gap:20px;
      padding:24px 0; min-height:100vh; justify-content:center;
      opacity:0; transition:opacity 0.6s ease 0.1s;
    }
    .scene.visible { opacity:1; }

    .hint {
      color:#6b6b6b; font-size:13px; letter-spacing:0.08em;
      font-family:'Georgia',serif; font-style:italic;
      opacity:1; transition:opacity 0.6s ease; user-select:none;
    }
    .hint.hidden { opacity:0; pointer-events:none; }
    .card {
      width:min(85vw, 420px); height:min(127.5vw, 630px); position:relative;
      transform-style:preserve-3d; cursor:pointer;
      filter:drop-shadow(0 8px 24px rgba(0,0,0,0.5));
      transition:filter 0.5s ease;
    }
    .card:hover { filter:drop-shadow(0 12px 36px rgba(0,0,0,0.6)); }
    .card__back {
      position:absolute; width:100%; height:100%;
      border-radius:4px; overflow:hidden;
      backface-visibility:hidden; transform:translateZ(-1px);
    }
    .card__back img { width:100%; height:100%; object-fit:cover; display:block; }
    .card__front {
      position:absolute; width:100%; height:100%;
      transform-origin:left center; transform-style:preserve-3d;
      transition:transform 1.1s cubic-bezier(0.4,0.0,0.2,1);
      border-radius:4px;
    }
    .card__front-face {
      position:absolute; width:100%; height:100%;
      backface-visibility:hidden; border-radius:4px; overflow:hidden;
    }
    .card__front-face img { width:100%; height:100%; object-fit:cover; display:block; }
    .card__front-inside {
      position:absolute; width:100%; height:100%;
      backface-visibility:hidden; transform:rotateY(180deg);
      border-radius:4px; background:#161616;
      background-image:
        radial-gradient(ellipse at 20% 50%,rgba(255,255,255,0.015) 0%,transparent 70%),
        radial-gradient(ellipse at 80% 20%,rgba(255,255,255,0.01) 0%,transparent 60%);
    }
    .card.open .card__front { transform:rotateY(-160deg); }
    .card.open .card__front-face::after {
      content:''; position:absolute; top:0; right:0;
      width:30px; height:100%;
      background:linear-gradient(to left,rgba(0,0,0,0.15),transparent);
      pointer-events:none;
    }
    .card.open .card__back::before {
      content:''; position:absolute; top:0; left:0;
      width:20px; height:100%;
      background:linear-gradient(to right,rgba(0,0,0,0.12),transparent);
      z-index:2; pointer-events:none; opacity:0;
      animation:fadeInShadow 0.8s 0.4s ease forwards;
    }
    @keyframes fadeInShadow { to { opacity:1; } }
    @media (min-width:768px) { .card { width:min(55vw, 400px); height:min(82.5vw, 600px); } }
    @media (min-width:1200px) { .card { width:440px; height:660px; } }
  </style>
</head>

  <script>
    (() => {
      const images = document.querySelectorAll('.card img');
      const loader = document.getElementById('loader');
      const scene = document.getElementById('scene');
      let loaded = 0;

      function onReady() {
        loaded++;
        if (loaded >= images.length) {
          loader.classList.add('done');
          scene.classList.add('visible');
          setTimeout(() => loader.remove(), 700);
        }
      }

      images.forEach(img => {
        if (img.complete) { onReady(); }
        else {
          img.addEventListener('load', onReady);
          img.addEventListener('error', onReady);
        }
      });

      const card = document.getElementById('card');
      const hint = document.getElementById('hint');
      let isOpen = false;
      card.addEventListener('click', () => {
        isOpen = !isOpen;
        card.classList.toggle('open', isOpen);
        if (hint && !hint.classList.contains('hidden')) hint.classList.add('hidden');
      });
    })();
  </script>
