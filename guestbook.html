<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>guestbook - sol's paradise</title>
    <link rel="icon" href="assets/frames/1.png" type="image/png">
    <script src="scripts/anicon.js" defer></script>
    <script src="scripts/scroll.js" defer></script>
    <script src="scripts/sparkle.js" defer></script>
    <style>
        @font-face {
            font-family: 'W95FA';
            src: url('assets/fonts/W95FA.woff2') format('woff2'),
                url('assets/fonts/W95FA.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            background-image: url('assets/bg.png');
            background-repeat: repeat;
            font-family: 'W95FA', 'MS Sans Serif', Arial, sans-serif;
            color: #000;
            padding: 50px 20px 60px 20px;
        }

        ::selection {
            background: #0040ff;
            color: #ffffff;
        }

        .fixed-toggles {
            position: fixed;
            bottom: 16px;
            right: 16px;
            display: flex;
            gap: 6px;
            z-index: 100;
        }

        .retro-toggle {
            background: #c0c0c0;
            color: #000;
            font-family: 'W95FA', 'MS Sans Serif', Arial, sans-serif;
            font-size: 12px;
            padding: 4px 10px;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            cursor: pointer;
            image-rendering: pixelated;
            user-select: none;
        }

        .retro-toggle:active, .retro-toggle.off {
            border-color: #808080 #fff #fff #808080;
            background: #b0b0b0;
            padding: 5px 9px 3px 11px;
        }

        body.no-crt .crt {
            display: none;
        }

        .crt::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 20;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        @keyframes flicker {
            0% { opacity: 0.27861; }
            5% { opacity: 0.34769; }
            10% { opacity: 0.23604; }
            15% { opacity: 0.10626; }
            20% { opacity: 0.18128; }
            25% { opacity: 0.10626; }
            30% { opacity: 0.18128; }
            35% { opacity: 0.23604; }
        }

        .crt::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: rgba(18, 16, 16, 0.1);
            opacity: 0;
            z-index: 20;
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }

        .container {
            width: 100%;
            max-width: 780px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: 0 auto;
        }

        .card {
            width: 100%;
            min-width: 0;
            padding: 24px 20px 20px 20px;
            border-image-slice: 20 11 20 19 fill;
            border-image-width: 20px 11px 20px 19px;
            border-image-repeat: repeat round;
            border-style: solid;
            border-color: transparent;
            image-rendering: pixelated;
            border-image-source: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADEAAABoCAMAAABvw+gRAAAALVBMVEUAAADu7u6qqqqZmZmIiIh3d3e7u7vMzMz////d3d1mZmZVVVX+/v7v7+/w8PCGxkBUAAAAAXRSTlMAQObYZgAAA+lJREFUeNqNWAmC2zAINKeM4u3/n9tYK2yTcdzSY3UwGhAINlkuQiyibzE1MxbTfcbMsq/zAmLmjda30HqVoKAIFzWVqq9TowAo50TRxPQK8PVB6JfN9YT0+KJaOZtqYQAXQMjzArRq01coif1SXJZAtW6RciLy5EqFh/ySyPosiTwQ1nLtmxN0DmIgwCS6mJIbubUHnv/LqASdiHLoQ2j6noGw+yTTj3koM2fiIQsiVjJ+i9Izx8gsN7N4o0c4Wf9l1RSLHTDwbRhU4k3HSuiCorfBe0A8Jw1JvnF1nwD3p3dC+qtvlOOS+/gGaGhxXOGvuCsOlOPGuxmHV8YqVFyGSEZBpM5TbpFC7n59IoTZTnAyJvVAmJSTKgBhmlcF5xXi6oecm43biiyfVvWW88ZhIQ6xq9y6+GG/Wx8t4VAgoBgczq4iKpwFUqAjlPvF3DXHayB8UdaXpc/G0KoSlUlyWHPhNq3iewfynwyCNobTKH+qqUPNKCij+VgYqFSfMWUT8+IrkBHtCIYw05xuP7f1yhyOTNn+lMeViO6g/pCP80XNtTQuviETIQ/PCEOSHA9JXnED0dNMINmgWtCMR3I24ZbocVVo5ERMCDfrTaFElVnIbpVTRKwrL8NEPVQ2uOGs1Natt2h9pmIrRmHnBOHTig0K3PTDupkdWB70J0ktPiOvwj1iGIUtKmnoEvPe5jzc8p0frg8a+shdaxkC526unIdu23Qd8or5mDX104afP9tHRIhmtjdaUQhvl2o3oMsrqBGkGnmdl0PQyE4OrHD81MaAZlpFX5Q2RPF8g8X+vF3wPa16HYRdXz5hebvFtUTQK46sZLG1eF6Js7bzi47GwOyQVal/7R+NTTJ15fJsf2oVzW5QxbnWROiDz4ihXSMryyLcTbuqTYSu9UVVGuKzIgY7eA427Rx89nNpHsqoRReK0aPOnTem1tMNKIiXQYL0xRGqiEVLJa4UKJmJqV9GQEHDj9o/qOps0KUGggnduO2cNN+5ciqTd/7wfINy/UZ4m83Yhd27zJ2E/FTmgciayCNJMuYglAiPufDaEdDkAKULv4K5RfMJWASqCtSShaf2RBR9EDs12fGzAXKQ5jOSFlK/PrgH0tBqHDQyFykQxTsgScO1e5RESlvq5ygG5hsfKBECjQ9Ldpk3KRyghGvB+XsJnI7jk6Ond9ipsOa77xztyaRKHeJLeYQAADfU74IWqUD0eUgbiOkI3Z9dQOQzrfReAx0Jc/gu6vkLE1b4NgqOLUuhgp9s8NGdnE1tOaXrqRr3WFZdipixRwRFEBGtFOuYrWPWWNh0ARFRURFR3Uc2f8r47yD4C5YqfMcto41mAAAAAElFTkSuQmCC");
        }

        .header-card {
            padding: 24px 16px;
            text-align: center;
        }

        .title {
            margin: 0;
            line-height: 1;
        }

        .title-img {
            image-rendering: pixelated;
            max-width: 100%;
            height: auto;
            width: 540px;
            aspect-ratio: 6 / 1;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        .card-heading {
            font-size: 14px;
            font-weight: bold;
            margin: 0 0 12px 0;
            color: #222;
            border-bottom: 1px dashed #888;
            padding-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .retro-link {
            color: #000;
            text-decoration: underline;
        }

        .retro-link:hover {
            background-color: #000;
            color: #fff;
        }

        .form-row {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left;
        }

        .form-label {
            font-size: 12px;
            font-weight: bold;
        }

        .retro-input, .retro-textarea {
            font-family: 'W95FA', 'MS Sans Serif', Arial, sans-serif;
            font-size: 13px;
            padding: 6px 8px;
            border: 2px inset #999;
            background: #fff;
            color: #000;
            width: 100%;
        }

        .retro-textarea {
            resize: vertical;
            min-height: 70px;
        }

        .retro-btn {
            background: #c0c0c0;
            color: #000;
            font-family: 'W95FA', 'MS Sans Serif', Arial, sans-serif;
            font-size: 13px;
            padding: 5px 16px;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            cursor: pointer;
            image-rendering: pixelated;
        }

        .retro-btn:active {
            border-color: #808080 #fff #fff #808080;
            padding: 6px 15px 4px 17px;
        }

        .status-msg {
            font-size: 12px;
            margin-top: 8px;
            font-weight: bold;
        }

        .entry-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
        }

        .entry-item {
            background: #fafafa;
            border: 1px dashed #bbb;
            padding: 10px 12px;
            text-align: left;
        }

        .entry-header {
            font-size: 12px;
            border-bottom: 1px dotted #ccc;
            padding-bottom: 4px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4px;
        }

        .entry-author {
            font-weight: bold;
        }

        .entry-date {
            color: #666;
            font-size: 11px;
        }

        .entry-body {
            font-size: 13px;
            line-height: 1.4;
            word-break: break-word;
            white-space: pre-wrap;
        }
    </style>
    <script>
        const SUPABASE_URL = "https://rkgzstnvmimumyuykueg.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrZ3pzdG52bWltdW15dXlrdWVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMDQ0NTQsImV4cCI6MjEwMjY4MDQ1NH0.yr0GnZ-u75XT60q7tj99Xzu1QPcSFjkreM_z-7Jk6NM";

        function escapeHTML(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        async function fetchEntries() {
            const listEl = document.getElementById('entries-list');
            if (!listEl) return;

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/guestbook?select=*&order=created_at.desc`, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (!res.ok) {
                    listEl.innerHTML = '<p style="font-size:12px; color:#888;">(database initializing — please run the SQL setup script in Supabase)</p>';
                    return;
                }

                const entries = await res.json();
                if (!entries || entries.length === 0) {
                    listEl.innerHTML = '<p style="font-size:12px; color:#666;">no entries yet — be the first to sign!</p>';
                    return;
                }

                listEl.innerHTML = entries.map(e => {
                    const date = new Date(e.created_at).toLocaleDateString(undefined, {
                        year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                    });
                    const authorHTML = e.website
                        ? `<a href="${escapeHTML(e.website)}" target="_blank" rel="noopener noreferrer" class="retro-link">${escapeHTML(e.name)}</a>`
                        : `<span>${escapeHTML(e.name)}</span>`;

                    return `
                        <div class="entry-item">
                            <div class="entry-header">
                                <span class="entry-author">★ ${authorHTML}</span>
                                <span class="entry-date">${date}</span>
                            </div>
                            <div class="entry-body">${escapeHTML(e.message)}</div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error("Guestbook fetch error:", err);
                listEl.innerHTML = '<p style="font-size:12px; color:red;">error loading entries.</p>';
            }
        }

        async function submitEntry(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const statusEl = document.getElementById('form-status');
            const name = document.getElementById('gb-name').value.trim();
            const website = document.getElementById('gb-website').value.trim();
            const message = document.getElementById('gb-message').value.trim();

            if (!name || !message) {
                statusEl.textContent = 'please fill in your name and message!';
                statusEl.style.color = 'red';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'signing...';
            statusEl.textContent = '';

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/guestbook`, {
                    method: 'POST',
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`,
                        "Content-Type": "application/json",
                        "Prefer": "return=representation"
                    },
                    body: JSON.stringify({
                        name: name,
                        website: website || null,
                        message: message
                    })
                });

                if (res.ok) {
                    statusEl.textContent = 'thank you for signing!';
                    statusEl.style.color = 'green';
                    document.getElementById('gb-form').reset();
                    fetchEntries();
                } else {
                    const err = await res.json();
                    statusEl.textContent = err.message || 'error submitting entry.';
                    statusEl.style.color = 'red';
                }
            } catch (err) {
                console.error(err);
                statusEl.textContent = 'network error. please try again.';
                statusEl.style.color = 'red';
            } finally {
                btn.disabled = false;
                btn.textContent = 'sign guestbook';
            }
        }

        function initCrtToggle() {
            const btn = document.getElementById('crt-toggle');
            const isOff = localStorage.getItem('crt') === 'off';
            if (isOff) {
                document.body.classList.add('no-crt');
                if (btn) btn.textContent = 'crt: off';
            }
            if (btn) {
                btn.addEventListener('click', () => {
                    document.body.classList.toggle('no-crt');
                    const nowOff = document.body.classList.contains('no-crt');
                    localStorage.setItem('crt', nowOff ? 'off' : 'on');
                    btn.textContent = nowOff ? 'crt: off' : 'crt: on';
                });
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            initCrtToggle();
            fetchEntries();
            const form = document.getElementById('gb-form');
            if (form) form.addEventListener('submit', submitEntry);
        });
    </script>
</head>

<body>
    <button id="crt-toggle" class="crt-toggle" type="button">crt: on</button>
    <div class="crt"></div>

    <div class="container">
        <!-- Header -->
        <header class="card header-card">
            <h1 class="title">
                <a href="index.html"><img src="assets/title.png" alt="welcome to my paradise" class="title-img"></a>
            </h1>
        </header>

        <!-- Sign Form Card -->
        <div class="card">
            <div class="card-heading">
                <span>// sign the guestbook</span>
                <a href="index.html" class="retro-link">&laquo; return home</a>
            </div>

            <form id="gb-form">
                <div class="form-row">
                    <label class="form-label" for="gb-name">name / handle *</label>
                    <input type="text" id="gb-name" class="retro-input" maxlength="50" required placeholder="your name...">
                </div>

                <div class="form-row">
                    <label class="form-label" for="gb-website">website / link (optional)</label>
                    <input type="url" id="gb-website" class="retro-input" maxlength="100" placeholder="https://...">
                </div>

                <div class="form-row">
                    <label class="form-label" for="gb-message">message *</label>
                    <textarea id="gb-message" class="retro-textarea" maxlength="500" required placeholder="leave a note..."></textarea>
                </div>

                <div style="text-align: left; margin-top: 10px;">
                    <button type="submit" id="submit-btn" class="retro-btn">sign guestbook</button>
                    <div id="form-status" class="status-msg"></div>
                </div>
            </form>
        </div>

        <!-- Entries List Card -->
        <div class="card">
            <div class="card-heading">
                <span><span style="color: #ff2a7a;">//</span> entries</span>
            </div>
            <div id="entries-list" class="entry-list">
                <p style="font-size:12px; color:#888;">loading entries...</p>
            </div>
        </div>

        <div class="card" style="max-width: 320px; margin: 0 auto;">
            <h2 class="card-heading"><span style="color: #7928ca;">//</span> music</h2>
            <div id="sol-music-player"></div>
        </div>
    </div>
    <script src="scripts/music_player.js"></script>
</body>
