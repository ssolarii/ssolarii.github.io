<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♥️</title>
    <link rel="icon" href="assets/frames/1.png" type="image/png">
    <script src="scripts/anicon.js" defer></script>
    <script src="scripts/scroll.js" defer></script>
    <script src="scripts/sparkle.js" defer></script>
    <style>
        @font-face {
            font-family: 'W95FA';
            src: url('assets/fonts/W95FA.woff2') format('woff2'),
                url('assets/fonts/W95FA.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('assets/bg.png');
            background-repeat: repeat;
            font-family: 'W95FA', 'MS Sans Serif', Arial, sans-serif;
            color: #000;
            padding: 20px;
        }

        #counter {
            text-decoration: underline;
        }

        .crt-toggle {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: #c0c0c0;
            color: #000;
            font-family: 'W95FA', 'MS Sans Serif', Arial, sans-serif;
            font-size: 12px;
            padding: 4px 10px;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            cursor: pointer;
            z-index: 100;
            image-rendering: pixelated;
            user-select: none;
        }

        .crt-toggle:active {
            border-color: #808080 #fff #fff #808080;
            padding: 5px 9px 3px 11px;
        }

        body.no-crt .crt {
            display: none;
        }

        .crt::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 20;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        @keyframes flicker {
            0% {
                opacity: 0.27861;
            }

            5% {
                opacity: 0.34769;
            }

            10% {
                opacity: 0.23604;
            }

            15% {
                opacity: 0.10626;
            }

            20% {
                opacity: 0.18128;
            }

            25% {
                opacity: 0.10626;
            }

            30% {
                opacity: 0.18128;
            }

            35% {
                opacity: 0.23604;
            }
        }

        .crt::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: rgba(18, 16, 16, 0.1);
            opacity: 0;
            z-index: 20;
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }

        .container {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: 0 auto;
        }

        .home-link {
            color: #000;
            text-decoration: underline;
            padding: 2px 4px;
        }

        .home-link:hover {
            background-color: #000;
            color: #fff;
        }

        .card {
            width: 100%;
            min-width: 0;
            padding: 24px 20px 20px 20px;
            text-align: center;
        }

        .header-card {
            padding: 24px 16px;
        }

        .title {
            margin: 0;
            line-height: 1;
        }

        .title-img {
            image-rendering: pixelated;
            max-width: 100%;
            height: auto;
            width: 540px;
            aspect-ratio: 6 / 1;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 200px minmax(0, 1fr) 200px;
            gap: 16px;
            align-items: start;
        }

        .main-content {
            min-width: 0;
        }

        .sidebar-left,
        .sidebar-right {
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-width: 0;
        }

        .card-heading {
            font-size: 13px;
            font-weight: bold;
            margin: 0 0 10px 0;
            color: #222;
            border-bottom: 1px dashed #888;
            padding-bottom: 4px;
            text-align: left;
        }

        .nav-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }

        .nav-list li {
            margin: 6px 0;
        }

        .nav-list a,
        .retro-link {
            color: #000;
            text-decoration: underline;
        }

        .nav-list a:hover,
        .retro-link:hover {
            background-color: #000;
            color: #fff;
        }

        .nav-disabled {
            color: #888;
            user-select: none;
        }

        .nav-disabled del {
            text-decoration: line-through;
            color: #888;
        }

        .side-text {
            font-size: 12px;
            margin: 6px 0;
            text-align: left;
        }

        .discord-icon {
            width: 12px;
            height: 12px;
            vertical-align: -1px;
            display: inline-block;
            margin-left: 2px;
        }

        .notice {
            font-size: 13px;
            color: #222;
            margin: 0;
            text-align: left;
        }

        .notice p {
            margin: 0 0 8px 0;
            line-height: 1.5;
        }

        .notice p:last-child {
            margin-bottom: 0;
        }

        .notice-divider {
            border: none;
            border-top: 1px dashed #bbb;
            margin: 10px 0;
        }

        .divider {
            border: none;
            border-top: 1px dashed #777;
            margin: 16px 0;
        }

        .buttons-marquee {
            width: 100%;
            overflow: hidden;
            user-select: none;
        }

        .buttons-track {
            display: flex;
            width: max-content;
            animation: scroll-buttons 45s linear infinite;
        }

        .buttons-marquee:hover .buttons-track {
            animation-play-state: paused;
        }

        .buttons-group {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-right: 8px;
        }

        .buttons-group img {
            display: block;
            image-rendering: pixelated;
            outline: 1px dotted #000;
        }

        @keyframes scroll-buttons {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <script>
        const start = new Date('2026-08-18T22:07:12-06:00');

        function formatElapsedTime(diffMs) {
            if (diffMs < 0) diffMs = 0;
            const totalSeconds = Math.floor(diffMs / 1000);
            const totalMinutes = Math.floor(totalSeconds / 60);
            const totalHours = Math.floor(totalMinutes / 60);
            const totalDays = Math.floor(totalHours / 24);
            const totalMonths = Math.floor(totalDays / 30.4375);
            const totalYears = Math.floor(totalDays / 365.25);

            const seconds = totalSeconds % 60;
            const minutes = totalMinutes % 60;
            const hours = totalHours % 24;
            const days = Math.floor(totalDays % 30.4375);
            const months = totalMonths % 12;
            const years = totalYears;

            const units = [];
            if (years > 0) units.push({ val: years, singular: "year", plural: "years" });
            if (months > 0 || years > 0) units.push({ val: months, singular: "month", plural: "months" });
            if (days > 0 || months > 0 || years > 0) units.push({ val: days, singular: "day", plural: "days" });
            if (hours > 0 || days > 0 || months > 0 || years > 0) units.push({ val: hours, singular: "hour", plural: "hours" });
            if (minutes > 0 || hours > 0 || days > 0 || months > 0 || years > 0) units.push({ val: minutes, singular: "minute", plural: "minutes" });
            units.push({ val: seconds, singular: "second", plural: "seconds" });

            const active = [];
            for (const u of units) {
                if (active.length === 0 && u.val === 0) continue;
                active.push(u);
                if (active.length === 2) break;
            }

            if (active.length === 0) {
                return "0 seconds";
            }

            return active
                .filter((u) => u.val > 0 || active.length === 1)
                .map((u) => `${u.val} ${u.val === 1 ? u.singular : u.plural}`)
                .join(" ");
        }

        function updateCounter() {
            const now = new Date();
            const diff = now - start;
            const el = document.getElementById('counter');
            if (el) {
                el.textContent = formatElapsedTime(diff);
            }
        }

        function initCrtToggle() {
            const btn = document.getElementById('crt-toggle');
            const isOff = localStorage.getItem('crt') === 'off';
            if (isOff) {
                document.body.classList.add('no-crt');
                if (btn) btn.textContent = 'crt: off';
            }
            if (btn) {
                btn.addEventListener('click', () => {
                    document.body.classList.toggle('no-crt');
                    const nowOff = document.body.classList.contains('no-crt');
                    localStorage.setItem('crt', nowOff ? 'off' : 'on');
                    btn.textContent = nowOff ? 'crt: off' : 'crt: on';
                });
            }
        }

        async function updateLanyardStatus() {
            try {
                const res = await fetch('https://api.lanyard.rest/v1/users/903330250610577418');
                const data = await res.json();
                if (!data.success) return;

                const presence = data.data;
                const statusEl = document.getElementById('discord-status');
                const trackEl = document.getElementById('spotify-track');

                if (statusEl) {
                    const statusColors = {
                        online: '#43b581',
                        idle: '#faa61a',
                        dnd: '#f04747',
                        offline: '#747f8d'
                    };
                    const status = presence.discord_status || 'offline';
                    const color = statusColors[status] || '#747f8d';
                    statusEl.innerHTML = `[<span style="color: ${color}; font-size: 10px;">●</span> ${status} <img src="assets/discord.svg" class="discord-icon" alt="discord">]`;
                }

                if (trackEl) {
                    if (presence.listening_to_spotify && presence.spotify) {
                        const song = presence.spotify.song;
                        const artist = presence.spotify.artist;
                        const trackId = presence.spotify.track_id;
                        trackEl.innerHTML = `<a href="https://open.spotify.com/track/${trackId}" target="_blank" rel="noopener noreferrer" class="retro-link" title="${song} by ${artist}"><b>${song}</b> — ${artist}</a> <a href="https://open.spotify.com/user/312tpdqjc4wbmnjm6qhv2i5zxl5m" target="_blank" rel="noopener noreferrer" title="Spotify Profile"><img src="assets/spotify.svg" class="discord-icon" alt="spotify"></a>`;
                    } else {
                        trackEl.innerHTML = `nothing right now <a href="https://open.spotify.com/user/312tpdqjc4wbmnjm6qhv2i5zxl5m" target="_blank" rel="noopener noreferrer" title="Spotify Profile"><img src="assets/spotify.svg" class="discord-icon" alt="spotify"></a>`;
                    }
                }
            } catch (err) {
                console.error("Lanyard error:", err);
            }
        }

        const SUPABASE_URL = "https://rkgzstnvmimumyuykueg.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrZ3pzdG52bWltdW15dXlrdWVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMDQ0NTQsImV4cCI6MjEwMjY4MDQ1NH0.yr0GnZ-u75XT60q7tj99Xzu1QPcSFjkreM_z-7Jk6NM";

        function getCookie(name) {
            const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return match ? match[2] : null;
        }

        async function updateViewCount() {
            const counterEl = document.getElementById('view-counter');
            if (!counterEl) return;

            const isAdmin = getCookie('sol_is_admin') === '1' || localStorage.getItem('sol_is_admin') === '1' || sessionStorage.getItem('sol_admin_pass');
            const hasViewCookie = getCookie('sol_viewed');

            try {
                if (!isAdmin && !hasViewCookie) {
                    // Send +1 view request (only for non-admin visitors)
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/increment_view_count`, {
                        method: "POST",
                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Authorization": `Bearer ${SUPABASE_KEY}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ page_name: "home" })
                    });
                    if (res.ok) {
                        const count = await res.json();
                        counterEl.textContent = String(count).padStart(6, '0');
                        // Set cookie for 1 hour (3600s)
                        document.cookie = "sol_viewed=1; max-age=3600; path=/; SameSite=Lax";
                    }
                } else {
                    // Admin or cached visitor: read current count only (no increment)
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/page_views?id=eq.home&select=count`, {
                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Authorization": `Bearer ${SUPABASE_KEY}`
                        }
                    });
                    if (res.ok) {
                        const rows = await res.json();
                        if (rows && rows.length > 0) {
                            counterEl.textContent = String(rows[0].count).padStart(6, '0');
                        }
                    }
                }
            } catch (err) {
                console.error("View count error:", err);
            }
        }

        function escapeHTML(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        async function fetchLatestPost() {
            const blogEl = document.getElementById('miniblog-entry');
            if (!blogEl) return;
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/posts?select=*&is_published=eq.true&order=created_at.desc&limit=1`, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });
                if (res.ok) {
                    const posts = await res.json();
                    if (posts && posts.length > 0) {
                        const p = posts[0];
                        const date = new Date(p.created_at).toLocaleDateString(undefined, {
                            year: 'numeric', month: 'short', day: 'numeric'
                        });
                        const moodHtml = p.mood ? `<span style="color:#0040ff; margin-left: 6px;">[mood: ${escapeHTML(p.mood)}]</span>` : '';
                        blogEl.innerHTML = `
                            <div style="font-weight:bold; font-size:14px; margin-bottom:4px;">✦ ${escapeHTML(p.title)}</div>
                            <div style="font-size:11px; color:#666; margin-bottom:8px;">${date} ${moodHtml}</div>
                            <div style="font-size:13px; line-height:1.4; white-space:pre-wrap;">${escapeHTML(p.content)}</div>
                        `;
                        return;
                    }
                }
                blogEl.innerHTML = '<p style="font-size:12px; color:#888;">no posts published yet.</p>';
            } catch (err) {
                console.error(err);
            }
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", () => {
                updateCounter();
                setInterval(updateCounter, 1000);
                initCrtToggle();
                updateLanyardStatus();
                setInterval(updateLanyardStatus, 15000);
                updateViewCount();
                fetchLatestPost();
            });
        } else {
            updateCounter();
            setInterval(updateCounter, 1000);
            initCrtToggle();
            updateLanyardStatus();
            setInterval(updateLanyardStatus, 15000);
            updateViewCount();
            fetchLatestPost();
        }
    </script>
</head>

<body>
    <button id="crt-toggle" class="crt-toggle" type="button">crt: on</button>
    <div class="crt"></div>

    <div class="container">
        <header class="card">
            <h1 class="title">
                <img src="assets/loveu.gif" alt="i love you" class="title-img">
            </h1>
            <p><a href="index.html" class="home-link">«</a></p>
        </header>
    </div>
</body>

</html>
