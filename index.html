        .crt-toggle {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: #c0c0c0;
            color: #000;
            font-family: 'W95FA', 'MS Sans Serif', Arial, sans-serif;
            font-size: 12px;
            padding: 4px 10px;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            cursor: pointer;
            z-index: 100;
            image-rendering: pixelated;
            user-select: none;
        }

        .crt-toggle:active {
            border-color: #808080 #fff #fff #808080;
            padding: 5px 9px 3px 11px;
        }

        body.no-crt .crt {
            display: none;
        }

        .crt::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 20;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        @keyframes flicker {
            0% {
                opacity: 0.27861;
            }

            5% {
                opacity: 0.34769;
            }

            10% {
                opacity: 0.23604;
            }

            15% {
                opacity: 0.10626;
            }

            20% {
                opacity: 0.18128;
            }

            25% {
                opacity: 0.10626;
            }

            30% {
                opacity: 0.18128;
            }

            35% {
                opacity: 0.23604;
            }
        }

        .crt::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: rgba(18, 16, 16, 0.1);
            opacity: 0;
            z-index: 20;
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }

    <script>
        const start = new Date('2026-08-18T15:27:00-06:00');

        function formatElapsedTime(diffMs) {
            if (diffMs < 0) diffMs = 0;
            const totalSeconds = Math.floor(diffMs / 1000);
            const totalMinutes = Math.floor(totalSeconds / 60);
            const totalHours = Math.floor(totalMinutes / 60);
            const totalDays = Math.floor(totalHours / 24);
            const totalMonths = Math.floor(totalDays / 30.4375);
            const totalYears = Math.floor(totalDays / 365.25);

            const seconds = totalSeconds % 60;
            const minutes = totalMinutes % 60;
            const hours = totalHours % 24;
            const days = Math.floor(totalDays % 30.4375);
            const months = totalMonths % 12;
            const years = totalYears;

            const units = [];
            if (years > 0) units.push({ val: years, singular: "year", plural: "years" });
            if (months > 0 || years > 0) units.push({ val: months, singular: "month", plural: "months" });
            if (days > 0 || months > 0 || years > 0) units.push({ val: days, singular: "day", plural: "days" });
            if (hours > 0 || days > 0 || months > 0 || years > 0) units.push({ val: hours, singular: "hour", plural: "hours" });
            if (minutes > 0 || hours > 0 || days > 0 || months > 0 || years > 0) units.push({ val: minutes, singular: "minute", plural: "minutes" });
            units.push({ val: seconds, singular: "second", plural: "seconds" });

            const active = [];
            for (const u of units) {
                if (active.length === 0 && u.val === 0) continue;
                active.push(u);
                if (active.length === 2) break;
            }

            if (active.length === 0) {
                return "0 seconds";
            }

            return active
                .filter((u) => u.val > 0 || active.length === 1)
                .map((u) => `${u.val} ${u.val === 1 ? u.singular : u.plural}`)
                .join(" ");
        }

        function updateCounter() {
            const now = new Date();
            const diff = now - start;
            const el = document.getElementById('counter');
            if (el) {
                el.textContent = formatElapsedTime(diff);
            }
        }

        function initCrtToggle() {
            const btn = document.getElementById('crt-toggle');
            const isOff = localStorage.getItem('crt') === 'off';
            if (isOff) {
                document.body.classList.add('no-crt');
                if (btn) btn.textContent = 'crt: off';
            }
            if (btn) {
                btn.addEventListener('click', () => {
                    document.body.classList.toggle('no-crt');
                    const nowOff = document.body.classList.contains('no-crt');
                    localStorage.setItem('crt', nowOff ? 'off' : 'on');
                    btn.textContent = nowOff ? 'crt: off' : 'crt: on';
                });
            }
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", () => {
                updateCounter();
                setInterval(updateCounter, 1000);
                initCrtToggle();
            });
        } else {
            updateCounter();
            setInterval(updateCounter, 1000);
            initCrtToggle();
        }
    </script>
