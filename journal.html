            font-family: 'W95FA';
            src: url('assets/fonts/W95FA.woff2') format('woff2'),

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            background-image: url('assets/bg.png');
            background-repeat: repeat;

            color: #000;
            padding: 50px 20px 60px 20px;

        ::selection {
            background: #0040ff;
            color: #ffffff;
        }

        .fixed-toggles {
            position: fixed;
            bottom: 16px;
            right: 16px;
            display: flex;
            gap: 6px;
            z-index: 100;
        }

        .retro-toggle {
            background: #c0c0c0;
            color: #000;
            font-family: 'W95FA', 'MS Sans Serif', Arial, sans-serif;
            font-size: 12px;
            padding: 4px 10px;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            cursor: pointer;
            image-rendering: pixelated;
            user-select: none;
        }

        .retro-toggle:active, .retro-toggle.off {
            border-color: #808080 #fff #fff #808080;
            background: #b0b0b0;
            padding: 5px 9px 3px 11px;
        }

        body.no-crt .crt {
            display: none;
        }

        .crt::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 20;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        @keyframes flicker {
            0% {
                opacity: 0.27861;
            }

            5% {
                opacity: 0.34769;
            }

            10% {
                opacity: 0.23604;
            }

            15% {
                opacity: 0.10626;
            }

            20% {
                opacity: 0.18128;
            }

            25% {
                opacity: 0.10626;
            }

            30% {
                opacity: 0.18128;
            }

            35% {
                opacity: 0.23604;
            }
        }

        .crt::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: rgba(18, 16, 16, 0.1);
            opacity: 0;
            z-index: 20;
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }

            width: 100%;
            max-width: 780px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: 0 auto;

        .header-card {
            padding: 24px 16px;
            text-align: center;
        }

        .title {
            margin: 0;
            line-height: 1;

        .title-img {
            image-rendering: pixelated;

    <script>
        const SUPABASE_URL = "https://rkgzstnvmimumyuykueg.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrZ3pzdG52bWltdW15dXlrdWVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMDQ0NTQsImV4cCI6MjEwMjY4MDQ1NH0.yr0GnZ-u75XT60q7tj99Xzu1QPcSFjkreM_z-7Jk6NM";

        function escapeHTML(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        async function fetchJournal() {
            const listEl = document.getElementById('journal-list');
            if (!listEl) return;

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/posts?select=*&is_published=eq.true&order=created_at.desc`, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (!res.ok) {
                    listEl.innerHTML = '<p style="font-size:12px; color:#888;">(database initializing — please run SQL in Supabase)</p>';
                    return;
                }

                const posts = await res.json();
                if (!posts || posts.length === 0) {
                    listEl.innerHTML = '<p style="font-size:12px; color:#666;">no journal entries published yet.</p>';
                    return;
                }

                listEl.innerHTML = posts.map(p => {
                    const date = new Date(p.created_at).toLocaleDateString(undefined, {
                        year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                    });
                    const moodHtml = p.mood ? `<span style="color:#0040ff; margin-left: 6px;">[mood: ${escapeHTML(p.mood)}]</span>` : '';

                    return `
                        <article class="journal-entry">
                            <div class="entry-header">
                                <span class="entry-title">✦ ${escapeHTML(p.title)}</span>
                                <span class="entry-meta">${date} ${moodHtml}</span>
                            </div>
                            <div class="entry-body">${escapeHTML(p.content)}</div>
                        </article>
                    `;
                }).join('');

            } catch (err) {
                console.error("Journal fetch error:", err);
                listEl.innerHTML = '<p style="font-size:12px; color:red;">error loading journal entries.</p>';
            }
        }

        function initCrtToggle() {
            const btn = document.getElementById('crt-toggle');
            const isOff = localStorage.getItem('crt') === 'off';
            if (isOff) {
                document.body.classList.add('no-crt');
                if (btn) btn.textContent = 'crt: off';
            }
            if (btn) {
                btn.addEventListener('click', () => {
                    document.body.classList.toggle('no-crt');
                    const nowOff = document.body.classList.contains('no-crt');
                    localStorage.setItem('crt', nowOff ? 'off' : 'on');
                    btn.textContent = nowOff ? 'crt: off' : 'crt: on';
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initCrtToggle();
            fetchJournal();
        });
    </script>
